  stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke;
  shape-rendering: geometricPrecision; stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: sigmaLoadingDraw 3.6s linear infinite, sigmaLoadingFillIntegrate 3.6s linear infinite, sigmaLoadingSoftenStroke 3.6s linear infinite;
}
@keyframes sigmaLoadingDraw {
  0%, 5% { stroke-dashoffset: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); }
  68%, 100% { stroke-dashoffset: 0; }
}
@keyframes sigmaLoadingFillIntegrate {
