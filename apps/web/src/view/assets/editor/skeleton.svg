  76%, 100% { fill-opacity: 1; }
}
@keyframes sigmaLoadingSoftenStroke {
  0%, 48% { stroke-opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); }
  78%, 100% { stroke-opacity: 0; }
}
@keyframes sigmaLoadingGroupFade {
  0% { opacity: 0; animation-timing-function: cubic-bezier(.4,0,.2,1); }
  16%, 78% { opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); }
  98%, 100% { opacity: 0; }
}
</style>
